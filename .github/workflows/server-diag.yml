name: Diagnóstico del servidor (solo lectura)

# Revisa dominios, carpetas, PHP, cron, respaldos y respuestas HTTPS sin cambiar nada.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d ' \r\n\t' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Servidor
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          echo "=== DOMINIOS ==="; uapi DomainInfo domains_data 2>/dev/null | grep -E "^\s+(domain|documentroot):"
          echo "=== CARPETAS ==="; ls -ld ~/public_html ~/ppd-api ~/ppd-api/public ~/pc.ppdguate.com 2>&1
          echo "=== API ==="; ls ~/ppd-api/public 2>&1 | head; [ -f ~/ppd-api/.env ] && echo ".env presente" || echo ".env FALTA"
          echo "=== PHP ==="; php -v | head -1
          echo "=== CRON ==="; crontab -l 2>&1 | grep -v "^$"
          echo "=== RESPALDOS ==="; ls -1 ~/ppdback/daily/ 2>&1 | tail -3; tail -1 ~/ppdback/daily/backup.log 2>&1
          echo "=== SUPER ADMIN / DEMO ==="; cd ~/ppd-api && php artisan tinker --execute='echo "super admin: ", App\Models\User::where("is_super_admin",1)->pluck("email")->implode(", ") ?: "NINGUNO", PHP_EOL, "demo: ", App\Models\Organization::where("slug","colegio-demo")->exists() ? "sí" : "no", PHP_EOL;' 2>/dev/null
          REMOTE

      - name: HTTPS
        run: |
          for u in http://pc.ppdguate.com/colegio-demo/login http://api.ppdguate.com/api/public/health; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$u" || true)"
          done
          for u in https://ppdguate.com/ https://api.ppdguate.com/api/public/health https://pc.ppdguate.com/ https://pc.ppdguate.com/colegio-demo/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u" || true); echo "$u -> $code"
          done
          echo | openssl s_client -connect api.ppdguate.com:443 -servername api.ppdguate.com 2>/dev/null | openssl x509 -noout -subject -issuer -enddate || true
          echo | openssl s_client -connect pc.ppdguate.com:443 -servername pc.ppdguate.com 2>/dev/null | openssl x509 -noout -subject -enddate || true
          echo "cadena pc: $(echo | openssl s_client -connect pc.ppdguate.com:443 -servername pc.ppdguate.com -verify_return_error 2>&1 | grep -E 'Verify return code' | head -1)"
          echo "cadena api: $(echo | openssl s_client -connect api.ppdguate.com:443 -servername api.ppdguate.com -verify_return_error 2>&1 | grep -E 'Verify return code' | head -1)"

      - name: Limpiar llave
        if: always()
        run: rm -f ~/.ssh/deploy_key
