# Revisión de la App (Flutter): análisis y pruebas en cada PR que toque app/.
# No publica nada: la subida a Google Play / App Store se hace aparte, con el dueño.
name: App (Flutter)

on:
  pull_request:
    paths: ['app/**', '.github/workflows/app-ci.yml']
  push:
    branches: [main]
    paths: ['app/**']

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.c.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ -f app/pubspec.yaml ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Todavía no hay app/pubspec.yaml"; fi

  test:
    needs: check
    if: needs.check.outputs.exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Generar código (si usa build_runner)
        run: |
          if grep -q build_runner pubspec.yaml; then dart run build_runner build --delete-conflicting-outputs; fi
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Sin secretos en el código
        run: |
          if grep -rInE "(-----BEGIN (RSA |EC )?PRIVATE KEY-----|\"private_key\"\s*:)" lib android ios 2>/dev/null; then
            echo "::error::Parece haber una llave o secreto en el código de la App."; exit 1; fi
