name: Borrar cuenta (con respaldo)

# Borra POR COMPLETO una cuenta para que el correo se pueda registrar otra vez.
# Primero respalda la base de datos; con "vista previa" solo muestra lo que borraría.
on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Correo de la cuenta'
        required: true
      tipo:
        description: 'guardian (App de padres) o staff (PC)'
        required: true
        default: 'guardian'
      confirmar:
        description: 'Escriba BORRAR para borrar; deje vacío para solo vista previa'
        required: false
        default: ''

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validar entradas
        env:
          EMAIL_IN: ${{ inputs.email }}
          TIPO_IN: ${{ inputs.tipo }}
        run: |
          case "$EMAIL_IN" in *[!A-Za-z0-9@._+-]*|"") echo "::error::Correo no válido."; exit 1;; esac
          case "$TIPO_IN" in guardian|staff) ;; *) echo "::error::Tipo debe ser guardian o staff."; exit 1;; esac

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_KEY" | tr -d ' \r\n\t' | base64 -d > ~/.ssh/deploy_key 2>/dev/null || printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Respaldo + borrado
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          EMAIL_IN: ${{ inputs.email }}
          TIPO_IN: ${{ inputs.tipo }}
          CONFIRMAR: ${{ inputs.confirmar }}
        run: |
          FORCE=""; [ "$CONFIRMAR" = "BORRAR" ] && FORCE="--force"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "EMAIL_IN='$EMAIL_IN' TIPO_IN='$TIPO_IN' FORCE='$FORCE' bash -s" <<'REMOTE'
          set -e
          cd ~/ppd-api
          if [ -n "$FORCE" ]; then
            val(){ grep -E "^$1=" .env | head -1 | cut -d= -f2- | sed 's/^"//; s/"$//'; }
            umask 077
            CNF=$(mktemp); printf '[client]\nuser=%s\npassword=%s\n' "$(val DB_USERNAME)" "$(val DB_PASSWORD)" > "$CNF"
            OUT=~/ppdback/db-prepurge-$(date +%Y%m%d%H%M%S).sql.gz
            mysqldump --defaults-extra-file="$CNF" --single-transaction "$(val DB_DATABASE)" | gzip > "$OUT"
            rm -f "$CNF"; chmod 600 "$OUT"
            echo "Respaldo: $OUT ($(du -h "$OUT" | cut -f1))"
          fi
          php artisan ppd:account-purge "$EMAIL_IN" --type="$TIPO_IN" $FORCE
          REMOTE

      - name: Limpiar llave
        if: always()
        run: rm -f ~/.ssh/deploy_key
