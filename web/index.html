<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProPlayer Data · En construcción</title>
<meta name="description" content="ProPlayer Data: asistencias, convocatorias, posiciones y minutos. Muy pronto.">
<meta name="theme-color" content="#f3f2f2">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M18 8H82V46C82 69 68 83 50 93C32 83 18 69 18 46Z' fill='%23f3f2f2' stroke='%23201e1d' stroke-width='6'/%3E%3Crect x='30' y='60' width='12' height='22' fill='%23201e1d'/%3E%3Crect x='44' y='50' width='12' height='34' fill='%23201e1d'/%3E%3Crect x='58' y='38' width='12' height='40' fill='%2325984d'/%3E%3Cpath d='M18 27H82' stroke='%23201e1d' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600&family=Saira+Extra+Condensed:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2f2;--ink:#201e1d;--muted:#4a4644;--bar:#25984d;--star:#d28316}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
.pg{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:'Saira',sans-serif;padding:clamp(28px,5vw,64px)}
.cond{font-family:'Saira Extra Condensed',sans-serif;font-style:italic}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(48px,8vw,88px);width:100%;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:center;gap:clamp(16px,3vw,36px);flex-wrap:wrap}
.mark{width:clamp(96px,16vw,200px);height:auto;flex:none}
h1{margin:0;font-weight:800;font-size:clamp(60px,12vw,140px);line-height:.85;text-transform:uppercase}
.tag{display:flex;align-items:center;justify-content:center;gap:.6em;margin-top:.5em;font-weight:600;font-size:clamp(16px,2.6vw,32px);line-height:1;letter-spacing:.3em;text-transform:uppercase}
.tag .live{letter-spacing:.14em}
.star{width:.7em;height:.7em;flex:none;fill:var(--star);animation:pp-pulse 1.6s ease-in-out infinite}
.msg{display:flex;flex-direction:column;align-items:center;gap:20px;max-width:60ch}
.msg-head{display:flex;align-items:flex-end;justify-content:center;flex-wrap:wrap;gap:16px}
.loader{display:flex;align-items:flex-end;gap:5px;height:44px;flex:none;margin-bottom:2px}
.loader span{width:10px;height:44px;background:var(--ink);transform-origin:bottom;animation:pp-bar 1.2s ease-in-out infinite}
.loader span:nth-child(2){animation-delay:.18s}
.loader span:nth-child(3){animation-delay:.36s;background:var(--bar)}
h2{margin:0;font-weight:800;font-size:clamp(36px,5.5vw,64px);line-height:.9;text-transform:uppercase}
p{margin:0;font-size:clamp(16px,1.6vw,19px);line-height:1.6;color:var(--muted);text-wrap:pretty}
footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:48px;font-family:'Saira Extra Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
footer .pw{flex-basis:100%;padding-top:8px;text-align:center}
@keyframes pp-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@keyframes pp-bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){
.star{animation:none}
.loader span{animation:none}
.loader span:nth-child(1){transform:scaleY(.5)}
.loader span:nth-child(2){transform:scaleY(.75)}
}
</style>
</head>
<body>
<div class="pg">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<path id="ec-star" d="M0 -4.8L1.076 -1.481L4.565 -1.483L1.741 .566L2.821 3.883L0 1.83L-2.821 3.883L-1.741 .566L-4.565 -1.483L-1.076 -1.481Z"/>
<path id="ec-shield" d="M18 8H82V46C82 69 68 83 50 93C32 83 18 69 18 46Z"/>
<clipPath id="ec-cp"><path d="M18 8H82V46C82 69 68 83 50 93C32 83 18 69 18 46Z"/></clipPath>
<symbol id="ec-mark" viewBox="0 0 100 100">
<g clip-path="url(#ec-cp)" fill="#201e1d">
<rect x="27" y="67" width="14" height="42"/>
<rect x="43" y="56" width="14" height="53"/>
<rect x="59" y="43" width="14" height="66" fill="#25984d"/>
</g>
<g stroke="#201e1d" stroke-linecap="round">
<g transform="translate(34 60.5) rotate(-35)"><path d="M-5.8 0Q0 -7.2 5.8 0Q0 7.2 -5.8 0Z" fill="#9a5328" stroke-width="1.3" stroke-linejoin="round"/><path d="M-2 0H2M-1.2 -.9V.9M0 -.9V.9M1.2 -.9V.9" fill="none" stroke="#f3f2f2" stroke-width=".8"/></g>
<g transform="translate(50 49.5)"><circle r="4.6" fill="#f3f2f2" stroke-width="1.4"/><path d="M0 -4.6V4.6M-4.6 0H4.6M-3.3 -3.2Q-1.2 0 -3.3 3.2M3.3 -3.2Q1.2 0 3.3 3.2" fill="none" stroke-width="1"/></g>
<g transform="translate(66 36.5)"><circle r="4.6" fill="#f3f2f2" stroke-width="1.4"/><path d="M0 -1.9L1.807 -.587L1.117 1.537L-1.117 1.537L-1.807 -.587Z" fill="#201e1d" stroke-width=".6"/><path d="M0 -1.9V-4.6M1.807 -.587L4.375 -1.421M1.117 1.537L2.704 3.721M-1.117 1.537L-2.704 3.721M-1.807 -.587L-4.375 -1.421" fill="none" stroke-width="1"/></g>
</g>
<g fill="#d28316"><use href="#ec-star" x="30" y="17.5"/><use href="#ec-star" x="40" y="17.5"/><use href="#ec-star" x="50" y="17.5"/><use href="#ec-star" x="60" y="17.5"/><use href="#ec-star" x="70" y="17.5"/></g>
<path d="M18 27H82" stroke="#201e1d" stroke-width="3.5"/>
<use href="#ec-shield" fill="none" stroke="#201e1d" stroke-width="5"/>
</symbol>
</defs>
</svg>
<main>
<div class="brand">
<svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Escudo de ProPlayer Data"><use href="#ec-mark"/></svg>
<div class="cond">
<h1>ProPlayer</h1>
<div class="tag"><span>Data</span><svg class="star" viewBox="-5 -5 10 10" aria-hidden="true"><use href="#ec-star"/></svg><span class="live">En vivo</span></div>
</div>
</div>
<div class="msg">
<div class="msg-head">

</div>
<p>Estamos preparando la plataforma. Muy pronto podrá seguir asistencias, convocatorias, posiciones y minutos.</p>
</div>
</main>
<footer>
<span>© 2026 ProPlayer Data</span>

</footer>
</div>
</body>
</html>
