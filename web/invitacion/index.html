<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.ppdguate.com; img-src 'self' https://api.ppdguate.com data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
<title>Invitación · ppd</title>
<link rel="stylesheet" href="/assets/forms.css">
</head>
<body>
<div class="wrap"><div class="card">
  <div class="brand" id="brand"><strong>ppd</strong></div>

  <div id="loading"><p>Cargando invitación…</p></div>

  <div id="invalid" class="hidden">
    <h1>Invitación no disponible</h1>
    <p id="invalid-msg">La invitación no existe, fue anulada o ya venció. Pida una nueva a su institución.</p>
  </div>

  <form id="form" class="hidden" novalidate>
    <h1 id="title">Acepte su invitación</h1>
    <p id="intro"></p>
    <div id="new-user">
      <label for="name">Su nombre completo</label>
      <input id="name" autocomplete="name" maxlength="150">
      <label for="relationship">Parentesco (opcional)</label>
      <input id="relationship" placeholder="Padre, madre, encargado…" maxlength="20">
    </div>
    <label for="password" id="password-label">Cree una contraseña</label>
    <input id="password" type="password" autocomplete="new-password" maxlength="200">
    <div class="hint" id="password-hint">Mínimo 10 caracteres, con letras y números.</div>
    <div id="confirm-box">
      <label for="password2">Repita la contraseña</label>
      <input id="password2" type="password" autocomplete="new-password" maxlength="200">
    </div>
    <div class="err" id="err" role="alert"></div>
    <button id="send" type="submit">Aceptar invitación</button>
  </form>

  <div id="done" class="hidden">
    <h1 class="ok">¡Listo!</h1>
    <p id="done-msg"></p>
  </div>

  <div class="foot">Powered by ppd</div>
</div></div>
<script src="/assets/ppd.js"></script>
<script src="/invitacion/invitacion.js"></script>
</body>
</html>
