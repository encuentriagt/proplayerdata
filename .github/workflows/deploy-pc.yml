name: Deploy PC (pc.ppdguate.com)

on:
  push:
    branches: [main]
    paths:
      - "pc/**"
      - ".github/workflows/deploy-pc.yml"
  pull_request:
    paths:
      - "pc/**"
  workflow_dispatch:
    inputs:
      e2e:
        description: "Correr también las pruebas e2e (Playwright)"
        type: boolean
        default: false

concurrency:
  group: deploy-pc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Hasta que el agente de la web suba pc/package.json no hay nada que compilar.
    if: hashFiles('pc/package.json') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: pc/package.json   # usa la versión de "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pc/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoría de dependencias (solo producción, nivel alto)
        run: pnpm audit --prod --audit-level high

      - name: Pruebas
        run: pnpm test

      - name: Pruebas e2e (opcional)
        if: github.event_name == 'workflow_dispatch' && inputs.e2e
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e

      - name: Compilar
        env:
          VITE_API_URL: https://api.ppdguate.com/api
        run: pnpm build

      - name: Revisar el build
        run: |
          test -f dist/index.html || { echo "Falta dist/index.html"; exit 1; }
          test -f dist/.htaccess || { echo "Falta dist/.htaccess"; exit 1; }
          if find dist -type f \( -name "*.map" -o -name ".env*" -o -name "*.zip" -o -name "*.sql" \) | grep -q .; then
            echo "Hay archivos que no deben publicarse en dist/"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pc-dist
          path: pc/dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pc-dist
          path: dist

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          if printf '%s' "$SSH_KEY" | grep -q "BEGIN OPENSSH PRIVATE KEY"; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/deploy_key
          else
            printf '%s' "$SSH_KEY" | tr -d ' \r\n\t' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copiar a ~/pc.ppdguate.com (incluye .htaccess)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          test -f dist/.htaccess || { echo "El artefacto no trae .htaccess"; exit 1; }
          rsync -rlz --checksum --delete --chmod=D755,F644 \
            --filter='P .well-known/' \
            --filter='P cgi-bin/' \
            --stats \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:pc.ppdguate.com/" | grep -E "Number of (regular )?files transferred|deleted"

      - name: Verificar (informativo)
        run: |
          for u in https://pc.ppdguate.com/ https://pc.ppdguate.com/colegio-demo/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$u" || true); echo "$u -> $code"
          done

      - name: Limpiar llave
        if: always()
        run: rm -f ~/.ssh/deploy_key
